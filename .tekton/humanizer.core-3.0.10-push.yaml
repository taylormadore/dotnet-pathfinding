apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  annotations:
    # Each recipe produces an independent snapshot for this component.
    test.appstudio.openshift.io/ignore-supersession: "true"
    build.appstudio.openshift.io/repo: https://github.com/taylormadore/dotnet-pathfinding?rev={{revision}}
    build.appstudio.redhat.com/commit_sha: '{{revision}}'
    build.appstudio.redhat.com/target_branch: '{{target_branch}}'
    pipelinesascode.tekton.dev/cancel-in-progress: "false"
    pipelinesascode.tekton.dev/max-keep-runs: "3"
    pipelinesascode.tekton.dev/on-cel-expression: |
      event == "push" && target_branch == "main" && (
        "recipes/Humanizer.Core/3.0.10/**".pathChanged() ||
        ".tekton/humanizer.core-3.0.10-push.yaml".pathChanged() ||
        ".tekton/build-pipeline.yaml".pathChanged()
      )
  labels:
    appstudio.openshift.io/application: dotnet-pathfinding
    appstudio.openshift.io/component: dotnet-pathfinding-e2170
    pipelines.appstudio.openshift.io/type: build
  name: humanizer-core-3-0-10-on-push
  namespace: tmadore-tenant
spec:
  params:
  - name: git-url
    value: '{{source_url}}'
  - name: revision
    value: '{{revision}}'
  - name: output-image
    value: quay.io/redhat-user-workloads-stage/tmadore-tenant/dotnet-pathfinding-e2170:humanizer.core-3.0.10-{{revision}}
  - name: recipe
    value: recipes/Humanizer.Core/3.0.10
  - name: builder-image
    value: quay.io/tmadore/dotnet-builder:dotnet-100@sha256:35d0cd8c5afc1d782bfa30764eafde64d4c2527f5195b1111461e8921df7e98d
  - name: build-task-bundle
    value: quay.io/tmadore/dotnet-build-oci-ta@sha256:a723f7189d143ae8efdb0cb201ebd0d54021fb2fcdddf50cdf56bf927cccc9e3
  pipelineRef:
    name: build-dotnet
  taskRunTemplate:
    serviceAccountName: build-pipeline-dotnet-pathfinding-e2170
  workspaces:
  - name: git-auth
    secret:
      secretName: '{{ git_auth_secret }}'
status: {}
