apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  annotations:
    # Each recipe produces an independent snapshot for this component.
    test.appstudio.openshift.io/ignore-supersession: "true"
    build.appstudio.openshift.io/repo: https://github.com/taylormadore/dotnet-pathfinding?rev={{revision}}
    build.appstudio.redhat.com/commit_sha: '{{revision}}'
    build.appstudio.redhat.com/target_branch: '{{target_branch}}'
    pipelinesascode.tekton.dev/cancel-in-progress: "false"
    pipelinesascode.tekton.dev/max-keep-runs: "3"
    pipelinesascode.tekton.dev/on-cel-expression: |
      event == "push" && target_branch == "main" && (
        "recipes/Newtonsoft.Json/9.0.1/**".pathChanged() ||
        ".tekton/newtonsoft.json-9.0.1-push.yaml".pathChanged() ||
        ".tekton/build-pipeline.yaml".pathChanged()
      )
  labels:
    appstudio.openshift.io/application: dotnet-pathfinding
    appstudio.openshift.io/component: dotnet-pathfinding-e2170
    pipelines.appstudio.openshift.io/type: build
  name: newtonsoft-json-9-0-1-on-push
  namespace: tmadore-tenant
spec:
  params:
  - name: git-url
    value: '{{source_url}}'
  - name: revision
    value: '{{revision}}'
  - name: output-image
    value: quay.io/redhat-user-workloads-stage/tmadore-tenant/dotnet-pathfinding-e2170:newtonsoft.json-9.0.1-{{revision}}
  - name: recipe
    value: recipes/Newtonsoft.Json/9.0.1
  - name: builder-image
    value: quay.io/tmadore/dotnet-builder:dotnet-100@sha256:ce68b3a840425ae7cd1f66f01b9dfdc89d75e4111ec0edc6bc9871297717ed61
  - name: build-task-bundle
    value: quay.io/tmadore/dotnet-build-oci-ta@sha256:a723f7189d143ae8efdb0cb201ebd0d54021fb2fcdddf50cdf56bf927cccc9e3
  pipelineRef:
    name: build-dotnet
  taskRunTemplate:
    serviceAccountName: build-pipeline-dotnet-pathfinding-e2170
  workspaces:
  - name: git-auth
    secret:
      secretName: '{{ git_auth_secret }}'
status: {}
